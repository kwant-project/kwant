[build-system]
requires = ["meson-python>=0.15.0", "ninja>=1.11.1", "cython>=3.0.8"]
build-backend = "mesonpy"

[project]
name = "kwant"
authors = [
    {name = "C. W. Groth (CEA), M. Wimmer, A. R. Akhmerov, X. Waintal (CEA), and others", email = "authors@kwant-project.org"},
]
description = "Kwant: a package for quantum transport calculations"
license = {text = "BSD-2-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
urls = {Homepage = "https://kwant-project.org"}
requires-python = ">=3.11"
dependencies = [
    "numpy >= 1.25.0",
    "scipy >= 1.11.0",
    "tinyarray >= 1.2.2",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
plotting = ["matplotlib >= 3.7.0", "plotly >= 2.7.0"]
continuum = ["sympy >= 1.11.0"]
qsymm = ["qsymm >= 1.2.6"]
mumps = ["python-mumps < 0.1"]

[tool.mesonpy]
version-source = "_version.__version__"
install-extra-wheel-files = [
    { source = "LICENSE.rst", destination = "LICENSE" },
]

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.build-dependencies]
compilers = "*"
cython = ">=3.0.8"
numpy = ">=1.25.0"
meson = ">=1.3.0"
meson-python = ">=0.15.0"
ninja = ">=1.11.1"

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
numpy = ">=1.25.0"
scipy = ">=1.11.0"
tinyarray = ">=1.2.2"
sympy = ">=1.13.3,<2"
matplotlib-base = ">=3.7.0"
plotly = ">=2.7.0"
qsymm = ">=1.2.6"
blas = "*"
openblas = "*"
compilers = "*"
cython = ">=3.0.8"
libgfortran = "*"
pytest = "*"
pytest-cov = "*"
pytest-flakes = "*"
pytest-pep8 = "*"
python-mumps = ">=0.0.3,<0.0.4"
meson = ">=1.3.0"
meson-python = ">=0.15.0"
ninja = ">=1.11.1"

[tool.pixi.pypi-dependencies]
kwant = { path = ".", editable = true, extras = ["plotting", "continuum", "qsymm", "mumps"] }

[tool.pixi.pypi-options]
no-build-isolation = ["kwant"]

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx-book-theme = "*"
numpydoc = "*"
requests = "*"
sphinx-togglebutton = "*"
jupyter-sphinx = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinxcontrib-svg2pdfconverter = "*"

[tool.pixi.feature.docs.tasks]
build-docs = "make -C doc html"

[tool.pixi.environments.default]
features = ["plotting", "continuum", "qsymm", "mumps"]
solve-group = "default"

[tool.pixi.environments.docs]
features = ["docs"]
solve-group = "default"
