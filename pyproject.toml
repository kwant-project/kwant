[build-system]
requires = ["meson-python>=0.15.0", "ninja>=1.11.1", "cython>=3.0.8", "setuptools-scm>=6.2", "numpy>=1.26.0"]
build-backend = "mesonpy"

[project]
name = "kwant"
authors = [
    {name = "C. W. Groth (CEA), M. Wimmer, A. R. Akhmerov, X. Waintal (CEA), and others", email = "authors@kwant-project.org"},
]
description = "Kwant: a package for quantum transport calculations"
license = {text = "BSD-2-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
urls = {Homepage = "https://kwant-project.org"}
requires-python = ">=3.11"
dependencies = [
    "numpy >= 2.0.0",
    "scipy >= 1.13.0",
    "tinyarray >= 1.2.4",
    "packaging >= 23.0",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
plotting = ["matplotlib >= 3.8.0", "plotly >= 5.15.0"]
continuum = ["sympy >= 1.11.0"]
qsymm = ["qsymm >= 1.2.6"]
mumps = ["python-mumps < 0.1"]

[tool.setuptools_scm]
write_to = "_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0.dev0"

[tool.mesonpy]
install-extra-wheel-files = [
    { source = "LICENSE.rst", destination = "LICENSE" },
]

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_DYNAMIC = "FALSE"
MKL_NUM_THREADS = "1"

[tool.pixi.dependencies]
python = ">=3.11.0"
packaging = ">=23.0"
tinyarray = ">=1.2.4"

[tool.pixi.pypi-dependencies]
kwant = { path = ".", editable = true }

[tool.pixi.pypi-options]
no-build-isolation = ["kwant"]

[tool.pixi.feature.minimal.dependencies]
# Core: oldest supported stack (SPEC-0 guidance, Aug 2025) without optional extras
python = "~=3.11.0"
numpy = ">=2.0,<2.1"
scipy = ">=1.13,<1.14"
tinyarray = "==1.2.4"
packaging = ">=23.0"

# Optional extras now live in dedicated features so that minimal-no-extras can exclude them.

[tool.pixi.feature.minimal-extras.dependencies]
# Pinned minimal versions of optional features
sympy = "~=1.12.0"  # continuum
matplotlib-base = "~=3.8.0"  # plotting
plotly = "~=5.15.0"  # plotting
qsymm = "~=1.2.6"  # qsymm
python-mumps = ">=0.0.3,<0.0.5"  # mumps

[tool.pixi.feature.mid.dependencies]
# Mid-range (current stable minor versions)
python = "~=3.12.0"
numpy = ">=2.2,<2.3"
scipy = ">=1.14,<1.15"
tinyarray = ">=1.2.5"
sympy = ">=1.13,<1.14"  # continuum mid

[tool.pixi.feature.latest.dependencies]
# Latest (allow newest releases)
python = "~=3.13.0"
numpy = ">=2.3"
scipy = ">=1.14"
tinyarray = ">=1.2.5"
sympy = ">=1.14.0"  # continuum latest

[tool.pixi.feature.extras.dependencies]
# Less restrictive (mid/latest) optional extras; allow solver to pick newer versions.
matplotlib-base = ">=3.10"  # plotting newer
plotly = ">=6.2"  # plotting newer
qsymm = ">=1.4.0"  # qsymm newer
python-mumps = ">=0.0.4,<0.1"  # mumps newer

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-flakes = "*"
pytest-pep8 = "*"

[tool.pixi.feature.build.dependencies]
compilers = "*"
cython = ">=3.0.8"
meson = ">=1.4.0"
meson-python = ">=0.15.0"
ninja = ">=1.11.1"
setuptools-scm = ">=6.2"

[tool.pixi.feature.docs.dependencies]
make = "*"
sphinx = "*"
sphinx-book-theme = "*"
numpydoc = "*"
requests = "*"
sphinx-togglebutton = "*"
jupyter-sphinx = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinxcontrib-svg2pdfconverter = "*"

[tool.pixi.feature.docs.tasks]
build-docs = "make -C doc html"

[tool.pixi.feature.precommit.dependencies]
git = "*"
pre-commit = "*"

[tool.pixi.feature.precommit.tasks]
pre-commit = "pre-commit"

[tool.pixi.environments]
default = { features = ["mid", "extras", "build", "test"], solve-group = "mid" }
mid = { features = ["mid", "extras", "build", "test"], solve-group = "mid" }
minimal = { features = ["minimal", "minimal-extras", "build", "test"], solve-group = "minimal" }
minimal-no-extras = { features = ["minimal", "build", "test"], solve-group = "minimal" }
latest = { features = ["latest", "extras", "build", "test"], solve-group = "latest" }
docs = { features = ["docs", "mid", "extras", "build"], solve-group = "mid" }
precommit = { features = ["precommit"], no-default-feature = true }

[tool.pixi.feature.test.tasks]
test = "pytest -r w src/kwant --junitxml=tests.xml --durations=10"
test-cov = "pytest -r w --cov=src/kwant --cov-report term --cov-report html --cov-report xml src/kwant --junitxml=tests.xml --durations=10"

[tool.pixi.feature.latest.tasks.test-all]
# There is no special reason to put this task under 'latest', except for 'latest'
# feature being only used in one environment.
depends-on = [
    { task = "test", environment = "minimal-no-extras" },
    { task = "test", environment = "minimal" },
    { task = "test", environment = "mid" },
    { task = "test" , environment = "latest" },
]
