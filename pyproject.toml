[build-system]
requires = ["hatchling", "hatch-cython", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kwant"
authors = [
    {name = "C. W. Groth (CEA), M. Wimmer, A. R. Akhmerov, X. Waintal (CEA), and others", email = "authors@kwant-project.org"},
]
description = "Kwant: a package for quantum transport calculations"
license = {text = "BSD-2-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
urls = {Homepage = "https://kwant-project.org"}
requires-python = ">=3.11"
dependencies = [
    "numpy >= 1.25.0",
    "scipy >= 1.11.0",
    "tinyarray >= 1.2.2",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
plotting = ["matplotlib >= 3.7.0", "plotly >= 2.7.0"]
continuum = ["sympy >= 1.11.0"]
qsymm = ["qsymm >= 1.2.6"]
mumps = ["python-mumps < 0.1"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kwant/_version.py"

[tool.hatch.build.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.hooks.cython.options]
compile_py = false
include_numpy = true
define_macros = [
    ["NPY_NO_DEPRECATED_API", "NPY_1_7_API_VERSION"]
]

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.build-dependencies]
compilers = "*"
cython = "*"
numpy = "*"

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
numpy = "*"
scipy = "*"
tinyarray = "*"
sympy = ">=1.13.3,<2"
matplotlib-base = "*"
plotly = "*"
qsymm = "*"
blas = "*"
openblas = "*"
compilers = "*"
cython = "*"
libgfortran = "*"
pytest = "*"
pytest-cov = "*"
pytest-flakes = "*"
pytest-pep8 = "*"
sphinx = "*"
numpydoc = "*"
requests = "*"
sphinx-book-theme = "*"
jupyter-sphinx = "*"
sphinx-togglebutton = "*"
python-mumps = ">=0.0.3,<0.0.4"
hatchling = "*"
hatch-cython = "*"
hatch-vcs = "*"

[tool.pixi.pypi-dependencies]
kwant = { path = ".", editable = true, extras = ["plotting", "continuum", "qsymm", "mumps"] }

[tool.pixi.pypi-options]
no-build-isolation = ["kwant"]

