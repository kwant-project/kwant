[build-system]
requires = ["setuptools>=66.1", "setuptools-scm", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "kwant"
authors = [
    {name = "C. W. Groth (CEA), M. Wimmer, A. R. Akhmerov, X. Waintal (CEA), and others", email = "authors@kwant-project.org"},
    {name = "M. Wimmer"},
    {name = "A. R. Akhmerov"},
    {name = "X. Waintal (CEA)"},
    {name = "and others"},
]
description = "Kwant: a package for quantum transport calculations"
license = {text = "BSD-2-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
urls = {Homepage = "https://kwant-project.org"}
requires-python = ">=3.8"
dependencies = [
    "numpy >= 1.18.0",
    "scipy >= 1.3.0, != 1.6.1",
    "tinyarray >= 1.2.2",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.optional-dependencies]
plotting = ["matplotlib >= 3.2.2", "plotly >= 2.7.0"]
continuum = ["sympy >= 1.5.1"]
qsymm = ["qsymm >= 1.2.6"]
mumps = ["python-mumps < 0.1"]

[tool.setuptools]
platforms = [
    "Unix",
    "Linux",
    "MacOS X",
    "Windows",
]
license-files = ["LICENSE.rst"]
include-package-data = true

[tool.setuptools_scm]
version_file = "src/kwant/_version.py"

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.build-dependencies]
compilers = "*"
cython = "*"
setuptools = "*"
numpy = "*"
setuptools-scm = "*"

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
numpy = "*"
scipy = "*"
tinyarray = "*"
sympy = ">=1.13.3,<2"
matplotlib-base = "*"
plotly = "*"
qsymm = "*"
mumps-seq = "*"
metis = "5.1.0.*"
blas = "*"
openblas = "*"
compilers = "*"
cython = "*"
libgfortran = "*"
pytest = "*"
pytest-cov = "*"
pytest-flakes = "*"
pytest-pep8 = "*"
sphinx = "*"
numpydoc = "*"
requests = "*"
sphinx-book-theme = "*"
jupyter-sphinx = "*"
sphinx-togglebutton = "*"
python-mumps = ">=0.0.3,<0.0.4"

[tool.pixi.pypi-dependencies]
sphinxcontrib-svg2pdfconverter = "*"
kwant = { path = ".", editable = true, extras = ["plotting", "continuum", "qsymm", "mumps"] }

[tool.pixi.pypi-options]
no-build-isolation = ["kwant"]
