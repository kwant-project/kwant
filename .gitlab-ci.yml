image: ghcr.io/prefix-dev/pixi:0.50.2

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  SSH_COMMAND: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"

default:
  before_script:
    - pixi global install git
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git fetch --tags

.test_template:
  artifacts:
    reports:
      junit: tests.xml
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - build

run tests:
  parallel:
    matrix:
      - PIXI_ENV:
          - minimal-no-extras
          - minimal
          - mid
          - latest
  script:
    - pixi run -e $PIXI_ENV test
  extends: .test_template

run coverage:
  variables:
    PIXI_ENV: minimal
  script:
    - pixi run -e $PIXI_ENV test-cov
  artifacts:
    paths:
      - htmlcov
    reports:
      junit: tests.xml
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - build

build documentation:
  variables:
    PIXI_ENV: mid
  script:
    - pixi run -e docs build-docs
  artifacts:
    paths:
      - doc/build/html/
    expire_in: 1 month
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - build

check for broken links in doc:
  variables:
    PIXI_ENV: mid
  script:
    - pixi run -e docs make -C doc linkcheck
  allow_failure: true
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - build

run pre-commit:
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - pixi run pre-commit run --all-files
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pre-commit-cache
      - .pixi

# Keep the existing upload jobs
## Upload coverage reports and dev documentation

upload coverage:
  image: eeacms/rsync
  only:
    - schedules
  needs:
    - run coverage
  environment:
    name: coverage/$CI_COMMIT_REF_NAME
    url: https://kwant-project.org/coverage/$CI_COMMIT_REF_SLUG
    on_stop: remove_coverage
  before_script:
    - eval $(ssh-agent -s)
    - echo $MASTER_WEBSITE_KEY | base64 -d | ssh-add -
  script:
    - mv htmlcov $CI_COMMIT_REF_SLUG
    - rsync -rlv -e "$SSH_COMMAND" --delete --relative $CI_COMMIT_REF_SLUG kwant@kwant-project.org:coverage/

remove_coverage:
  only:
    - branches@kwant/kwant
  when: manual
  environment:
    name: coverage/$CI_COMMIT_REF_NAME
    action: stop
  before_script:
    - eval $(ssh-agent -s)
    - echo $MASTER_WEBSITE_KEY | base64 -d | ssh-add -
  script:
    - mkdir empty/
    - rsync -rlv -e "$SSH_COMMAND" --delete empty/ kwant@kwant-project.org:coverage/$CI_COMMIT_REF_SLUG

upload documentation to the test server:
  image: eeacms/rsync
  environment:
    name: docs review/$CI_COMMIT_REF_NAME
    url: https://test.kwant-project.org/doc/$CI_COMMIT_REF_SLUG
    on_stop: remove_docs
  needs:
    - build documentation
  only:
    - branches@kwant/kwant
  before_script:
    - eval $(ssh-agent -s)
    - echo $TEST_WEBSITE_KEY | base64 -d | ssh-add -
  script:
    - rsync -rlv -e "$SSH_COMMAND" --delete doc/build/html/* kwant2@test.kwant-project.org:doc/$CI_COMMIT_REF_SLUG

remove_docs:
  image: eeacms/rsync
  when: manual
  only:
    - branches@kwant/kwant
  environment:
    name: docs review/$CI_COMMIT_REF_NAME
    action: stop
  before_script:
    - eval $(ssh-agent -s)
    - echo $TEST_WEBSITE_KEY | base64 -d | ssh-add -
  script:
    - mkdir empty
    - rsync -arv -e "$SSH_COMMAND" --delete empty/ kwant2@test.kwant-project.org:doc/$CI_COMMIT_REF_SLUG/

upload dev version docs:
  image: eeacms/rsync
  environment:
    name: production
    url: https://kwant-project.org/doc/dev
  needs:
    - build documentation
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "kwant/kwant"
  before_script:
    - eval $(ssh-agent -s)
    - echo $MASTER_WEBSITE_KEY | base64 -d | ssh-add -
  script:
    - rsync -rlv -e "$SSH_COMMAND" --delete doc/build/html/* kwant@kwant-project.org:doc/dev

## Build documentation for tagged releases

.tagged-version:
    only:
       - /^v[0-9]+\.[0-9]+.[0-9]+$/@kwant/kwant

build distribution:
  extends: .tagged-version
  variables:
    PIXI_ENV: default
  script:
    - rm -rf dist
    - pixi run -e $PIXI_ENV build-dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - build

gather release artifacts:
  extends: .tagged-version
  needs:
    - run tests
    - build documentation
    - build distribution
  script:
    - mkdir docs
    - mv doc/build/html docs/html
    - zip -r docs/kwant-doc-${CI_COMMIT_TAG//v}.zip docs/html
  artifacts:
    paths:
      - docs
      - dist
